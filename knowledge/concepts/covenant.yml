definition:
  title: Pacto
  paragraphs:
    - >-
      ברית — pacto — es un vínculo que יהוה establece con palabras, señales y
      responsabilidades. No es un contrato entre iguales. Abraham recibe
      promesa; Israel recibe Torah y memoria de liberación; en Marcos 14 la
      sangre del Mesías se nombra como sangre del pacto.
    - >-
      Un pacto mejor no significa un Elohim distinto ni una instrucción
      desechada. Hebreos habla de Torah en el corazón, conciencia purificada y
      pecados perdonados. El pacto ordena cómo vivir delante de יהוה y cómo
      tratar al hermano; no se reduce a una ceremonia.
  caution: >-
    Pacto antiguo y pacto renovado no deben leerse como dos religiones
    enfrentadas, ni como permiso para ignorar la palabra ya dada.
