    role: hebrew_expression
aliases:
  - Yom יהוה
  - יום יהוה
definition:
  title: Día de יהוה
  paragraphs:
    - >-
      יום יהוה — el día de יהוה — es el tiempo en que Elohim interviene de
      manera pública para juzgar, salvar y poner las cosas en su lugar. Los
      profetas lo anuncian como oscuridad para el orgullo y como luz para
      quienes esperan. No es un adorno escatológico: es una advertencia y una
      esperanza.
    - >-
      Ese día no autoriza calendarios cerrados ni el desprecio de quienes
      todavía caminan. Llama a vigilancia, retorno y justicia presente. El
      trono, las bestias y el remanente se leen bajo esa misma pregunta: de
      quién es el día y a quién pertenece la última palabra.
  caution: >-
    El día de יהוה no debe reducirse a una fecha moderna ni usarse para
    aterrorizar sin llamado al retorno.
