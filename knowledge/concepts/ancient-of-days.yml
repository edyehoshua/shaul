id: ancient-of-days
type: concept
names:
  es: Anciano de Días
forms:
  - word: word:atik-yomin-ar
    role: aramaic_expression
aliases:
  - Atik Yomin
  - עתיק יומין
definition:
  title: Anciano de Días
  paragraphs:
    - >-
      עתיק יומין — Atik Yomin — es la figura de Daniel 7 que se sienta a juzgar
      cuando las bestias han recibido su tiempo. El trono, el vestido blanco y
      los libros abiertos presentan un juicio que no pertenece a los poderes de
      la tierra.
    - >-
      Delante de él llega uno como בר אנש — Bar Enash — y recibe dominio, honra
      y reino. El Anciano de Días y el Hijo del Hombre no se leen como dos
      historias sueltas: el juicio y la entrega del reino pertenecen al mismo
      horizonte. Marcos une esa visión con el padecimiento y la venida en nubes.
  caution: >-
    Anciano de Días no debe convertirse en una pieza de una trinidad tardía
    sin argumentar el texto, ni separarse de Daniel 7 y de Bar Enash.
