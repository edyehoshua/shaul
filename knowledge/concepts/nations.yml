id: nations
type: concept
names:
  es: Naciones
aliases:
  - Goyim
  - גוים
definition:
  title: Naciones
  paragraphs:
    - >-
      גוים — naciones — nombra a los pueblos distintos de Israel. En la Torah
      pueden ser amenaza, testigos o invitados a servir al Elohim de Israel. En
      Efesios, quienes estaban lejos, ajenos a la comunidad de Israel y a los
      pactos, son acercados en la sangre del Mesías.
    - >-
      La incorporación no autoriza jactancia contra las ramas naturales. El
      acebuche vive de una raíz que no plantó. Las naciones reciben herencia y
      responsabilidad; no sustituyen a Israel ni quedan como espectadoras de
      una historia ajena.
  caution: >-
    «Gentiles» no debe usarse para borrar la distinción de los textos, ni para
    construir una iglesia que ocupa el lugar de Israel.
