id: bat-kol
type: concept
names:
  es: Voz celestial
aliases:
  - Bat Kol
  - בת קול
definition:
  title: Voz celestial
  paragraphs:
    - >-
      בת קול — bat kol, «hija de voz» — nombra una voz celestial que identifica
      y confirma. En la tevilah y en la metamorfosis, la voz declara al Hijo y
      llama a escucharlo. No es un ruido decorativo: ordena la escena y señala
      a Yehoshua.
    - >-
      Esa voz reúne matices de Hijo, Siervo y Escogido que se entienden mejor
      junto al Tanaj. No sustituye a la Escritura ni abre una revelación
      privada que pueda contradecir lo escrito. Quien oye la voz queda
      obligado a oír al Hijo.
  caution: >-
    Bat kol es una categoría de lectura, no una prueba automática de cada voz
    o impresión espiritual.
articles:
