id: wisdom
type: concept
names:
  es: Sabiduría
aliases:
  - Jojmá
  - חכמה
definition:
  title: Sabiduría
  paragraphs:
    - >-
      חכמה — jojmá — es el saber que sabe vivir delante de יהוה. No es
      erudición suelta ni una técnica para ganar discusiones. Proverbios la
      presenta como principio de temor y de orden; las cartas la contrastan con
      discursos persuasivos que no se aferran a la cabeza.
    - >-
      El Mesías manifiesta la sabiduría de Elohim. Recibir esa mente es
      discernir lo que el hombre natural no sondea. La sabiduría se prueba en
      el fruto: humildad, paz, justicia y una palabra que edifica.
  caution: >-
    Sabiduría no debe confundirse con prestigio intelectual, ni con cualquier
    tradición que se presente como profunda.
articles:
