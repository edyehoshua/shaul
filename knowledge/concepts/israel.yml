id: israel
type: concept
names:
  es: Israel
aliases:
  - ישראל
definition:
  title: Israel
  paragraphs:
    - >-
      ישראל es el pueblo que יהוה llama «mi pueblo» antes de salir de Mitzráim
      y adquiere de entre las naciones. Esa elección no significa pureza de
      sangre ni superioridad humana. La palabra de יהוה acerca de Israel no se
      descarta para inventar otro pueblo.
    - >-
      En el Mesías, quienes estaban lejos son acercados y ambos se reúnen en un
      solo pueblo. Romanos 11 usa el olivo: las naciones son injertadas en una
      raíz que no les pertenece por jactancia; las ramas naturales pueden volver
      a ser plantadas. Continuidad con transformación, no reemplazo.
  caution: >-
    Israel no se reduce a un Estado moderno, ni a una metáfora que borra al
    pueblo concreto. Tampoco autoriza especulación genealógica ni desprecio
    hacia las naciones incorporadas.
articles:
