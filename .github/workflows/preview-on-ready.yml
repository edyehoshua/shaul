name: preview-on-ready

# Deployment-economy gate for the Shaul Vercel project (§34, §41).
#
# Goal: a Git push must NOT produce an external preview; a preview triggers
# only when a PR becomes READY_FOR_REVIEW, refreshed lazily thereafter.
#
# SAFE to merge now:
#   - scripts/vercel-ignore.sh skips Draft PR previews and two historical
#     worker branches TODAY (no secrets required). Production / main always
#     builds.
#   - This workflow only deploys PREVIEWS, and only for non-draft PRs, when
#     Vercel secrets exist. Production is untouched.
#   - Hard no-op (job skipped) until VERCEL_TOKEN/ORG/PROJECT exist as repo
#     secrets, so merging introduces no CI failure.
#
# EXTERNAL GATE to fully match READY_FOR_REVIEW as the only preview trigger:
#   1. Add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#   2. Vercel dashboard -> Project Settings -> Git: stop auto-preview of
#      non-main branches so this workflow is the preview source.
# Until (2), a Ready-for-review PR without a new commit still depends on
# Vercel Git (ignoreCommand will allow the build once draft=false).

"on":
  pull_request:
    types: [ready_for_review, reopened, synchronize]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel credentials
        id: check
        shell: bash
        run: |
          if [[ -n "${VERCEL_TOKEN:-}" && -n "${VERCEL_ORG_ID:-}" && -n "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    needs: credentials
    runs-on: ubuntu-latest
    # Draft synchronize must not preview. The credential check exposes only a
    # boolean job output; secrets are never referenced directly in this if.
    # No credentials -> skip so CI never blocks on an un-activated gate.
    if: >
      github.event.pull_request.draft == false &&
      needs.credentials.outputs.available == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Install project deps
        run: npm ci
      - name: Build static output
        run: npm run vercel-build
      - name: Deploy preview
        id: deploy
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=preview --token "$TOKEN"
          URL="$(vercel deploy --prebuilt --token "$TOKEN")"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Post / refresh preview URL on the PR
        env:
          URL: ${{ steps.deploy.outputs.preview_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf '## Preview (ready_for_review)\n%s\n<!-- preview-ready -->' "$URL")"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "$body" --edit-last || \
            gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"

  on_ready_without_creds:
    needs: credentials
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'ready_for_review' &&
      needs.credentials.outputs.available != 'true'
    steps:
      - run: |
          echo "::warning::Deployment-economy GHA preview is inactive: VERCEL_TOKEN/ORG/PROJECT secrets are not configured. Draft pushes are still skipped by scripts/vercel-ignore.sh. Add the secrets (and optionally restrict Vercel Git previews) so Ready-for-review can deploy without a dummy commit."
